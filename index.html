<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>daily-learn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="panel" id="gate">

  <div class="panel-header">
    <span class="candle"></span>
    <span class="panel-label">daily-learn</span>
  </div>

  <div class="panel-body">

    <p class="note">the door is locked.</p>
    <p class="note">solve the little riddle to come in:</p>

    <p class="riddle">
      <span id="problem" class="riddle-sum">&hellip;</span>&nbsp;= ?
    </p>

    <div class="input-row">
      <input id="answer" class="answer-input" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" aria-label="answer" placeholder="your answer">
      <span class="input-caret">&#9998;</span>
    </div>

    <p class="note note-error" id="error" hidden>hmm, that's not quite right &mdash; try again.</p>

  </div>

  <div class="panel-footer">
    <span>press enter</span>
    <span id="attempts"></span>
  </div>
</main>

<main class="panel" id="site" hidden>

  <div class="panel-header">
    <span class="candle candle-lit"></span>
    <span class="panel-label">daily-learn</span>
  </div>

  <div class="panel-body">

    <p class="note note-success">the door creaks open.</p>
    <h1 class="welcome-heading">welcome, Gabriel</h1>
    <p class="hint">pull a book down to peek inside &#8213;</p>

    <div id="calendar" class="calendar" aria-label="reading calendar"></div>

  </div>

  <div class="panel-footer">
    <span>hover a book for details &middot; not real security</span>
    <span class="footer-right">
      <button id="sfx-toggle" class="toggle-btn" type="button" aria-pressed="true">SOUND: ON</button>
      <a href="https://github.com/neoutinn/daily-learn">source</a>
    </span>
  </div>
</main>

<script src="sfx.js"></script>
<script src="app.js"></script>
<script src="calendar.js"></script>

</body>
</html>
