<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DAILY-LEARN</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<main class="hud-panel" id="gate">
  <span class="corner corner-tl"></span>
  <span class="corner corner-tr"></span>
  <span class="corner corner-bl"></span>
  <span class="corner corner-br"></span>

  <div class="hud-header">
    <span class="status-dot"></span>
    <span class="hud-label">DAILY-LEARN // ACCESS</span>
  </div>

  <div class="hud-body">

    <p class="readout">SYSTEM ONLINE.</p>
    <p class="readout">IDENTITY VERIFICATION REQUIRED.</p>

    <p class="problem-line">
      SOLVE TO AUTHENTICATE&nbsp;&nbsp;<span id="problem" class="accent">&hellip;</span>&nbsp;=
    </p>

    <div class="input-row">
      <span class="input-caret">&gt;</span>
      <input id="answer" class="answer-input" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" aria-label="answer" placeholder="RESPONSE">
    </div>

    <p class="readout error" id="error" hidden>ACCESS DENIED &mdash; INCORRECT RESPONSE.</p>

  </div>

  <div class="hud-footer">
    <span>PRESS ENTER TO SUBMIT</span>
    <span id="attempts"></span>
  </div>
</main>

<main class="hud-panel" id="site" hidden>
  <span class="corner corner-tl"></span>
  <span class="corner corner-tr"></span>
  <span class="corner corner-bl"></span>
  <span class="corner corner-br"></span>

  <div class="hud-header">
    <span class="status-dot status-dot-online"></span>
    <span class="hud-label">DAILY-LEARN // ONLINE</span>
  </div>

  <div class="hud-body">

    <p class="readout success">ACCESS GRANTED.</p>
    <h1 class="welcome-heading">WELCOME, GABRIEL</h1>

    <div id="calendar" class="calendar" aria-label="progress calendar"></div>

    <p class="readout idle"><span class="idle-dot"></span> STANDING BY</p>

  </div>

  <div class="hud-footer">
    <span>HOVER A DAY FOR DETAILS &middot; NOT REAL AUTH</span>
    <span class="footer-right">
      <button id="voice-toggle" class="toggle-btn" type="button" aria-pressed="true">VOICE: ON</button>
      <button id="sfx-toggle" class="toggle-btn" type="button" aria-pressed="true">SFX: ON</button>
      <a href="https://github.com/neoutinn/daily-learn">SOURCE</a>
    </span>
  </div>
</main>

<script src="sfx.js"></script>
<script src="app.js"></script>
<script src="calendar.js"></script>

</body>
</html>
